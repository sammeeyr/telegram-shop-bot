name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: commerce
          POSTGRES_USER: commerce_migrator
          POSTGRES_PASSWORD: migrator_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U commerce_migrator -d commerce"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      JWT_SECRET_KEY: test_only_signing_secret_change_for_each_environment
      MIGRATION_DATABASE_URL: postgresql+asyncpg://commerce_migrator:migrator_test_only@localhost:5432/commerce
      COMMERCE_DATABASE_URL: postgresql+asyncpg://commerce_runtime:runtime_test_only@localhost:5432/commerce
      TEST_DATABASE_URL: postgresql+asyncpg://commerce_runtime:runtime_test_only@localhost:5432/commerce
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Create restricted runtime role
        env:
          PGPASSWORD: migrator_test_only
        run: |
          psql -h localhost -U commerce_migrator -d commerce -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE commerce_runtime LOGIN PASSWORD 'runtime_test_only' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT" \
            -c "GRANT CONNECT ON DATABASE commerce TO commerce_runtime" \
            -c "GRANT USAGE ON SCHEMA public TO commerce_runtime"
      - name: Apply migrations
        run: alembic upgrade head
      - name: Grant migrated table access
        env:
          PGPASSWORD: migrator_test_only
        run: |
          psql -h localhost -U commerce_migrator -d commerce -v ON_ERROR_STOP=1 \
            -c "GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO commerce_runtime" \
            -c "ALTER DEFAULT PRIVILEGES FOR ROLE commerce_migrator IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO commerce_runtime"
      - name: Run tests
        run: python -m pytest