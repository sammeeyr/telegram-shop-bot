[project]
name = "telegram-shop-bot"
version = "1.0.0"
description = "Cube Tech Enterprises shared commerce platform and Telegram shop"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.13,<4",
    "alembic>=1.13,<2",
    "asyncpg>=0.29,<1",
    "cryptography>=43,<47",
    "email-validator>=2.2,<3",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "PyJWT>=2.9,<3",
    "pwdlib[argon2]>=0.2,<1",
    "pydantic-settings>=2.5,<3",
    "SQLAlchemy[asyncio]>=2.0.30,<3",
    "aiosqlite>=0.20",
    "python-dotenv>=1.0",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.29"]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
commerce-api = "commerce_api.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["commerce_api*", "shopbot*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
